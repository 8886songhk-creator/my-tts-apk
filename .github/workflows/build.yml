name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 파일 불러오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK 준비
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          sudo chown -R "$USER:$USER" "$SDK_DIR"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 설정 파일 자동 생성
        run: |
          mkdir -p app
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TtsReaderApp"
          include ':app'
          EOF
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2'
          }
          android {
              namespace 'com.novel.ttsreader'
              compileSdk 34
              buildToolsVersion "34.0.0"
              defaultConfig {
                  applicationId "com.novel.ttsreader"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: APK 빌드 실행
        run: |
          find app -type f
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: 완성된 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Novel-TTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
